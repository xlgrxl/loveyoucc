<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>粉色爱心</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #120012, #000000);
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .hint {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.75);
      font-size: 14px;
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(255, 105, 180, 0.6);
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">点击屏幕，生成更多爱心</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

const colors = ['#ff69b4', '#ff1493', '#ff85c1', '#ffb6c1', '#ffc0cb', '#ff4fa3'];

function heartPath(x, y, size) {
  const pts = [];
  for (let i = 0; i <= 100; i++) {
    const t = Math.PI * 2 * i / 100;
    const px = 16 * Math.pow(Math.sin(t), 3);
    const py = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    pts.push([x + px * size / 18, y - py * size / 18]);
  }
  return pts;
}

function drawHeart(x, y, size, color, alpha = 1, scale = 1, glow = false) {
  ctx.save();
  ctx.globalAlpha = alpha;

  if (glow) {
    ctx.shadowColor = color;
    ctx.shadowBlur = 18;
  }

  ctx.fillStyle = color;
  ctx.beginPath();
  const pts = heartPath(x, y, size * scale);
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) {
    ctx.lineTo(pts[i][0], pts[i][1]);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

const hearts = [];

function addHeart(x, y, burst = false) {
  const size = burst ? 18 + Math.random() * 36 : 14 + Math.random() * 42;
  hearts.push({
    x,
    y,
    size,
    dx: (Math.random() - 0.5) * (burst ? 2.2 : 0.7),
    dy: (Math.random() - 0.5) * (burst ? 2.2 : 0.7),
    color: colors[Math.floor(Math.random() * colors.length)],
    pulse: Math.random() * Math.PI * 2,
    life: 1,
    rot: Math.random() * Math.PI * 2
  });
}

function fillScreen() {
  hearts.length = 0;
  const count = Math.max(60, Math.floor((window.innerWidth * window.innerHeight) / 22000));
  for (let i = 0; i < count; i++) {
    addHeart(Math.random() * window.innerWidth, Math.random() * window.innerHeight, false);
  }
}
fillScreen();

function drawBackground() {
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

  const grad = ctx.createRadialGradient(
    window.innerWidth / 2, window.innerHeight / 2, 0,
    window.innerWidth / 2, window.innerHeight / 2, Math.max(window.innerWidth, window.innerHeight)
  );
  grad.addColorStop(0, 'rgba(255, 105, 180, 0.12)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
}

function animate() {
  drawBackground();

  for (let i = hearts.length - 1; i >= 0; i--) {
    const h = hearts[i];
    h.x += h.dx;
    h.y += h.dy;
    h.pulse += 0.05;
    h.life -= 0.0005;

    const scale = 1 + Math.sin(h.pulse) * 0.06;
    const alpha = Math.max(0.25, 0.85 + Math.sin(h.pulse) * 0.15);

    drawHeart(h.x, h.y, h.size, h.color, alpha, scale, true);

    // 出界回弹
    if (h.x < -120) h.x = window.innerWidth + 120;
    if (h.x > window.innerWidth + 120) h.x = -120;
    if (h.y < -120) h.y = window.innerHeight + 120;
    if (h.y > window.innerHeight + 120) h.y = -120;

    // 太久自动更新位置，让画面一直“活着”
    if (h.life <= 0) {
      hearts.splice(i, 1);
      addHeart(Math.random() * window.innerWidth, Math.random() * window.innerHeight, false);
    }
  }

  requestAnimationFrame(animate);
}
animate();

// 点击 / 触摸生成更多爱心
function burstAt(x, y) {
  for (let i = 0; i < 18; i++) {
    addHeart(
      x + (Math.random() - 0.5) * 40,
      y + (Math.random() - 0.5) * 40,
      true
    );
  }
}

window.addEventListener('click', (e) => {
  burstAt(e.clientX, e.clientY);
});

window.addEventListener('touchstart', (e) => {
  if (e.touches.length > 0) {
    const t = e.touches[0];
    burstAt(t.clientX, t.clientY);
  }
});

</script>
</body>
</html>
